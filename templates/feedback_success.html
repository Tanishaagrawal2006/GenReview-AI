{% extends 'base.html' %}

{% block body %}
<div style="min-height:100vh;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:24px;">

    <!-- Top bar -->
    <div style="position:fixed;top:0;left:0;right:0;background:var(--navy-900);padding:12px 20px;display:flex;align-items:center;gap:10px;z-index:10;">
        <div style="width:28px;height:28px;background:var(--teal-500);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:white;">R</div>
        <span style="color:white;font-size:13px;font-weight:600;">ReviewFlow AI</span>
    </div>

    <!-- Success Card -->
    <div style="background:white;border:1px solid var(--slate-200);border-radius:16px;padding:40px 32px;text-align:center;max-width:360px;width:100%;box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-top:56px;">

        <!-- Check icon -->
        <div style="width:60px;height:60px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>

        <h2 style="font-size:20px;font-weight:800;color:var(--navy-900);letter-spacing:-0.02em;margin:0 0 10px;">Thank You!</h2>
        <p style="font-size:14px;color:var(--slate-500);line-height:1.7;margin:0;">Your feedback has been received. Our team has been notified and will follow up to make things right.</p>

        <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--slate-100);">
            <div style="font-size:11px;color:var(--slate-400);">Powered by ReviewFlow AI &mdash; Digital Byte Solutions</div>
        </div>
    </div>
</div>
{% endblock %}
{% block footer %}{% endblock %}
